# The plan's training sanity gate: masked PPO, v0 encoder, 100k steps against RandomPlayer.
# The agent must exceed 80% win rate vs random. If it does not, the reward or the masking is
# broken and no downstream result is trustworthy.
name: sanity_ppo_masked
algo: ppo_masked
encoder: v0
reward: shaped
train_opponent: random
battle_format: gen9randombattle

total_timesteps: 100000
num_envs: 6
seed: 0
device: cpu

learning_rate: 0.0003
gamma: 0.99
batch_size: 128
n_steps: 3072
ent_coef: 0.01
net_arch: [64, 64]

eval_battles: 200
