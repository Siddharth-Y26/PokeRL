# Short run for showing training live. Not part of the study matrix.
#
# Same agent as the sanity gate (masked PPO, v0, shaped, vs RandomPlayer), but at 50k steps
# it finishes in a few minutes, and it writes to results/live_demo_seed0 so no study run's
# model or CSVs are touched. ep_rew_mean climbs from about 0 towards +30 (the win bonus) as
# the agent learns to beat the random bot.
#
# Usage:  python -m pokerl.train --config configs/demo/live_demo.yaml
name: live_demo
algo: ppo_masked
encoder: v0
reward: shaped
train_opponent: random
battle_format: gen9randombattle

total_timesteps: 50000
num_envs: 6
seed: 0
device: cpu
torch_threads: 1

learning_rate: 0.0003
gamma: 0.99
batch_size: 128
n_steps: 3072
ent_coef: 0.01
net_arch: [64, 64]

eval_battles: 50
